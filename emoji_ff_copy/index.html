<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>مولّد الرموز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--surface:#0f0f1a;--card:#13131e;--border:#1e1e32;
  --accent:#7c5cfc;--accent2:#c084fc;--gold:#f4c430;--teal:#22d3a5;
  --text:#eeeeff;--muted:#5a5a90;--radius:14px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',sans-serif;font-weight:900;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90% 70% at 15% 5%,rgba(124,92,252,.14) 0%,transparent 55%),
    radial-gradient(ellipse 70% 60% at 85% 95%,rgba(192,132,252,.1) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(244,196,48,.04) 0%,transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:36px 18px 100px}

header{text-align:center;margin-bottom:44px}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,rgba(124,92,252,.18),rgba(192,132,252,.1));
  border:1px solid rgba(124,92,252,.4);border-radius:50px;
  padding:7px 20px;font-size:.8rem;color:var(--accent2);margin-bottom:18px;letter-spacing:.06em;
}
h1{
  font-size:clamp(2rem,7vw,4.2rem);line-height:1.1;
  background:linear-gradient(135deg,#fff 25%,var(--accent2) 60%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.sub{color:var(--muted);font-size:1rem}

.ctrl-panel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:24px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;
}
.cg{display:flex;flex-direction:column;gap:7px}
.cg label{font-size:.75rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
select,input[type=number]{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'Cairo',sans-serif;font-weight:900;font-size:.9rem;
  padding:10px 13px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s;
}
select:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,252,.15)}
select option{background:#15152a}

.search-wrap{position:relative;margin-bottom:22px}
.search-wrap input{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-family:'Cairo',sans-serif;font-weight:900;font-size:.95rem;
  padding:12px 46px 12px 16px;outline:none;transition:border-color .2s,box-shadow .2s;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,252,.15)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.cat-btn{
  background:var(--card);border:1px solid var(--border);border-radius:50px;
  color:var(--muted);font-family:'Cairo',sans-serif;font-weight:900;font-size:.82rem;
  padding:6px 16px;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.cat-btn:hover{border-color:var(--accent);color:var(--accent2);background:rgba(124,92,252,.08)}
.cat-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

.btn-gen{
  display:block;width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:var(--radius);color:#fff;
  font-family:'Cairo',sans-serif;font-weight:900;font-size:1.1rem;
  padding:15px;cursor:pointer;margin-bottom:24px;
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;
}
.btn-gen::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.1))}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(124,92,252,.45)}
.btn-gen:active{transform:translateY(0)}

.copy-bar{
  display:none;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 18px;margin-bottom:16px;
}
.copy-preview{flex:1;font-size:1.2rem;letter-spacing:.08em;color:var(--accent2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn-copy-all{
  background:rgba(124,92,252,.15);border:1px solid rgba(124,92,252,.4);border-radius:10px;
  color:var(--accent2);font-family:'Cairo',sans-serif;font-weight:900;font-size:.88rem;
  padding:8px 18px;cursor:pointer;white-space:nowrap;transition:all .2s;
}
.btn-copy-all:hover{background:rgba(124,92,252,.3);border-color:var(--accent);transform:translateY(-1px)}

.stats{display:none;flex-wrap:wrap;gap:20px;margin-bottom:18px}
.stat{font-size:.8rem;color:var(--muted)}.stat span{color:var(--accent2);font-size:.95rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:13px 6px 9px;cursor:pointer;
  transition:all .2s;position:relative;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.card:hover{border-color:var(--accent);background:rgba(124,92,252,.1);transform:translateY(-3px) scale(1.07);box-shadow:0 8px 24px rgba(124,92,252,.28)}
.card.copied{border-color:var(--teal);background:rgba(34,211,165,.1);animation:pulse .5s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,165,.5)}70%{box-shadow:0 0 0 14px rgba(34,211,165,0)}100%{box-shadow:0 0 0 0 rgba(34,211,165,0)}}
.glyph{font-size:1.65rem;line-height:1;user-select:none}
.code{font-size:.58rem;color:var(--muted);letter-spacing:.03em}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .ico{font-size:3rem;margin-bottom:12px}

.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(90px);
  background:var(--teal);color:#031e18;
  font-family:'Cairo',sans-serif;font-weight:900;font-size:.9rem;
  padding:11px 26px;border-radius:50px;z-index:999;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="badge">✦ أكثر من ٣٠٠٠ رمز في ١٨ فئة</div>
  <h1>مولّد الرموز</h1>
  <p class="sub">اختر الفئة، ولّد، وانسخ بنقرة واحدة</p>
</header>

<div class="ctrl-panel">
  <div class="cg"><label>عدد الرموز</label><input type="number" id="count" value="120" min="1" max="500"/></div>
  <div class="cg"><label>الترتيب</label>
    <select id="sort">
      <option value="random">عشوائي</option>
      <option value="asc">تصاعدي</option>
      <option value="desc">تنازلي</option>
    </select>
  </div>
  <div class="cg"><label>حجم البطاقات</label>
    <select id="gridSize">
      <option value="60">صغير جداً</option>
      <option value="88" selected>متوسط</option>
      <option value="110">كبير</option>
    </select>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="search" placeholder="ابحث برمز أو كود Unicode مثل 2665 ..."/>
</div>

<div class="cats" id="cats"></div>
<button class="btn-gen" onclick="generate()">⚡ توليد الرموز</button>

<div class="copy-bar" id="copyBar">
  <div class="copy-preview" id="copyPreview"></div>
  <button class="btn-copy-all" onclick="copyAll()">📋 نسخ الكل</button>
</div>
<div class="stats" id="stats">
  <div class="stat">المولَّد: <span id="sCount">0</span></div>
  <div class="stat">الفئة: <span id="sCat">—</span></div>
  <div class="stat">المتاح في الفئة: <span id="sPool">0</span></div>
</div>

<div class="grid" id="grid">
  <div class="empty" style="grid-column:1/-1"><div class="ico">✦</div><p>اضغط توليد الرموز للبدء</p></div>
</div>
</div>
<div class="toast" id="toast"></div>

// Build "الكل"
const allSymbols=[];
Object.entries(DB).forEach(([k,v])=>{ if(k!=="الكل") v.forEach(s=>allSymbols.push(s)); });
DB["الكل"]=allSymbols;

let currentCat="الكل",generated=[],searchActive=false;

// Category buttons
const catsEl=document.getElementById('cats');
Object.keys(DB).forEach(name=>{
  const b=document.createElement('button');
  b.className='cat-btn'+(name==='الكل'?' active':'');
  b.textContent=name;
  b.onclick=()=>{
    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');currentCat=name;
  };
  catsEl.appendChild(b);
});

// Grid size control
document.getElementById('gridSize').onchange=e=>{
  document.getElementById('grid').style.gridTemplateColumns=`repeat(auto-fill,minmax(${e.target.value}px,1fr))`;
};

// Search
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){searchActive=false;if(generated.length)renderGrid(generated);return;}
  searchActive=true;
  const pool=DB["الكل"];
  const res=pool.filter(s=>{
    const cp=s.codePointAt(0).toString(16).toUpperCase();
    return cp.toLowerCase().includes(q)||s.includes(q);
  });
  renderGrid(res.slice(0,300));
});

function generate(){
  if(searchActive){document.getElementById('search').value='';searchActive=false;}
  const count=Math.min(Math.max(parseInt(document.getElementById('count').value)||120,1),500);
  const sort=document.getElementById('sort').value;
  const pool=DB[currentCat];
  let syms=[];
  for(let i=0;i<count;i++) syms.push(pool[Math.floor(Math.random()*pool.length)]);
  if(sort==='asc') syms.sort((a,b)=>a.codePointAt(0)-b.codePointAt(0));
  if(sort==='desc') syms.sort((a,b)=>b.codePointAt(0)-a.codePointAt(0));
  generated=syms;
  renderGrid(syms);
  const bar=document.getElementById('copyBar');
  bar.style.display='flex';
  document.getElementById('copyPreview').textContent=syms.join(' ');
  document.getElementById('stats').style.display='flex';
  document.getElementById('sCount').textContent=syms.length;
  document.getElementById('sCat').textContent=currentCat;
  document.getElementById('sPool').textContent=pool.length;
}

function renderGrid(syms){
  const g=document.getElementById('grid');
  g.innerHTML='';
  if(!syms.length){
    g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="ico">🔍</div><p>لا توجد نتائج</p></div>';
    return;
  }
  const frag=document.createDocumentFragment();
  syms.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='card';
    d.style.animationDelay=`${Math.min(i*0.01,1.5)}s`;
    const cp=s.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');
    d.innerHTML=`<div class="glyph">${s}</div><div class="code">U+${cp}</div>`;
    d.onclick=()=>copyOne(s,d);
    frag.appendChild(d);
  });
  g.appendChild(frag);
}

function copyOne(s,card){
  navigator.clipboard.writeText(s).then(()=>{
    card.classList.add('copied');
    setTimeout(()=>card.classList.remove('copied'),900);
    showToast(`✓ تم نسخ  ${s}`);
  });
}

function copyAll(){
  navigator.clipboard.writeText(generated.join(' ')).then(()=>{
    showToast(`✓ تم نسخ ${generated.length} رمز!`);
  });
}
