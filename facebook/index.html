<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيسبوك - تسجيل الدخول أو الاشتراك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* General Styles */
        :root {
            --facebook-blue: #1877f2;
            --facebook-green: #42b72a;
            --light-gray-bg: #f0f2f5;
            --white-bg: #fff;
            --border-color: #ddd;
            --text-color-dark: #1c1e21;
            --text-color-medium: #606770;
            --shadow-light: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--light-gray-bg);
            direction: rtl;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-color-dark);
            font-weight: 400; /* Default Cairo weight for body text */
        }

        /* Main Wrapper - for desktop layout */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1; /* Allow to take available space */
            padding: 20px;
            max-width: 980px; /* Standard Facebook max-width */
            margin: auto;
            gap: 40px; /* Space between left and right panels */
        }

        /* Left Panel - Logo and Tagline */
        .left-panel {
            flex-basis: 500px; /* Fixed width for left panel on desktop */
            text-align: right; /* Text aligned to the right in RTL context */
            padding-right: 32px; /* Space from the form card */
        }

        .facebook-logo {
            color: var(--facebook-blue);
            font-size: 58px;
            font-weight: 900; /* Cairo Black */
            margin-bottom: 16px;
            line-height: 1;
        }

        .tagline {
            font-size: 28px;
            font-weight: 400;
            line-height: 32px;
            color: var(--text-color-dark);
        }

        /* Right Panel - Login Form Card */
        .right-panel {
            flex-basis: 396px; /* Fixed width for login card on desktop */
            text-align: center;
        }

        .login-form-card {
            background-color: var(--white-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-light);
            margin-bottom: 20px;
        }

        .login-form-card form {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Space between form elements */
        }

        .login-form-card input[type="text"],
        .login-form-card input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 17px;
            color: var(--text-color-dark);
            font-family: 'Cairo', sans-serif;
            text-align: right; /* For Arabic input */
        }

        .login-form-card input[type="text"]:focus,
        .login-form-card input[type="password"]:focus {
            outline: none;
            border-color: var(--facebook-blue);
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-toggle {
            position: absolute;
            left: 15px; /* Position to the left for RTL */
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--facebook-blue);
            cursor: pointer;
            user-select: none; /* Prevent text selection */
            font-weight: 700;
        }

        .login-button {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--facebook-blue);
            color: var(--white-bg);
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .2s ease;
        }

        .login-button:hover {
            background-color: #166fe5; /* Slightly darker blue */
        }

        .forgot-password {
            display: block;
            margin-top: 5px;
            color: var(--facebook-blue);
            text-decoration: none;
            font-size: 14px;
            transition: text-decoration .2s ease;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .separator {
            border-bottom: 1px solid var(--border-color);
            margin: 20px 0;
            line-height: 1px;
            text-align: center;
        }

        .separator span {
            background-color: var(--white-bg);
            padding: 0 10px;
            color: var(--text-color-medium);
            font-size: 13px;
        }

        .create-account-button {
            display: inline-block; /* To allow auto width */
            padding: 14px 20px;
            background-color: var(--facebook-green);
            color: var(--white-bg);
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .2s ease;
            text-decoration: none; /* If it's an anchor */
        }

        .create-account-button:hover {
            background-color: #36a420; /* Slightly darker green */
        }

        .create-page-link {
            font-size: 14px;
            color: var(--text-color-dark);
        }

        .create-page-link a {
            color: var(--text-color-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .create-page-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background-color: var(--white-bg);
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
            color: var(--text-color-medium);
        }

        .footer-languages {
            max-width: 980px;
            margin: 0 auto 15px;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 15px;
        }

        .footer-languages a {
            color: var(--text-color-medium);
            text-decoration: none;
        }

        .footer-languages a:hover {
            text-decoration: underline;
        }

        .footer-languages .current-lang {
            font-weight: 700;
        }

        .footer-copyright {
            margin-top: 10px;
            font-size: 11px;
            color: #737373;
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 0; /* Remove gap when stacking */
                padding: 40px 20px; /* More vertical padding */
            }

            .left-panel {
                flex-basis: auto;
                width: 100%;
                text-align: center;
                padding: 0;
                margin-bottom: 40px;
            }

            .facebook-logo {
                font-size: 48px;
                margin-bottom: 10px;
            }

            .tagline {
                font-size: 20px;
                line-height: 24px;
                max-width: 380px; /* Constrain tagline width on smaller screens */
                margin: 0 auto;
            }

            .right-panel {
                flex-basis: auto;
                width: 100%;
                max-width: 396px; /* Keep form card max width */
                margin-top: 0;
            }

            .login-form-card {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .facebook-logo {
                font-size: 42px;
            }
            .tagline {
                font-size: 18px;
            }
            .login-form-card input,
            .login-button,
            .create-account-button {
                font-size: 16px;
                padding: 12px 14px;
            }
            .forgot-password,
            .password-toggle,
            .create-page-link,
            .separator span {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="left-panel">
            <h1 class="facebook-logo">facebook</h1>
            <h2 class="tagline">تساعدك فيسبوك على التواصل مع الأشخاص ومشاركتهم ما في حياتك.</h2>
        </div>
        <div class="right-panel">
            <div class="login-form-card">
                <form id="loginForm">
                    <input type="text" id="email" name="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="كلمة السر" required>
                        <span class="password-toggle" onclick="togglePassword()">عرض</span>
                    </div>
                    <button type="submit" class="login-button">تسجيل الدخول</button>
                    <a href="#" class="forgot-password">هل نسيت كلمة السر؟</a>
                    <div class="separator">
                        <span>أو</span>
                    </div>
                    <button type="button" class="create-account-button" id="createAccountBtn">إنشاء حساب جديد</button>
                </form>
            </div>
            <div class="create-page-link">
                <p><a href="#">إنشاء صفحة</a> لشخص مشهور أو علامة تجارية أو نشاط تجاري.</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-languages">
            <a href="#" class="current-lang">العربية</a>
            <a href="#">English (US)</a>
            <a href="#">Français (France)</a>
            <a href="#">Deutsch</a>
            <a href="#">Español</a>
            <a href="#">Italiano</a>
            <a href="#">Português (Brasil)</a>
            <a href="#"> हिन्दी</a>
            <a href="#">中文(简体)</a>
            <a href="#">日本語</a>
            <a href="#">+</a>
        </div>
        <div class="footer-copyright">
            Meta © 2024
        </div>
    </div>

    <script>
        // Function to toggle password visibility
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleSpan = document.querySelector('.password-toggle');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleSpan.textContent = 'إخفاء';
            } else {
                passwordField.type = 'password';
                toggleSpan.textContent = 'عرض';
            }
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent actual form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                alert(`تم محاولة تسجيل الدخول باستخدام:\nالبريد الإلكتروني/رقم الهاتف: ${email}\nكلمة السر: ${password}\n\n(ملاحظة: هذه ليست وظيفة تسجيل دخول حقيقية، بل مثال توضيحي فقط.)`);
                // In a real application, you would send this data to a server for authentication.
            } else {
                alert('الرجاء إدخال البريد الإلكتروني/رقم الهاتف وكلمة السر للمتابعة.');
            }
        });

        // Handle "Create New Account" button click
        document.getElementById('createAccountBtn').addEventListener('click', function() {
            alert('سيتم توجيهك إلى صفحة إنشاء حساب جديد.');
            // In a real application, you would redirect the user:
            // window.location.href = 'signup.html';
        });
    </script>
</body>
</html>
